services:
  - type: web
    name: aurascope-full-spectrum
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: PORT
        value: 10000

# Webhook config:
# In Resend Dashboard -> Webhooks -> Add endpoint:
# URL: https://your-render-url.onrender.com/api/webhooks/resend
# Events: select all:
#   email.sent, email.delivered, email.delivery_delayed, email.bounced,
#   email.complained, email.opened, email.clicked, email.failed,
#   email.scheduled, email.suppressed, email.received,
#   contact.created, contact.updated, contact.deleted,
#   domain.created, domain.updated, domain.deleted
# Secret: whsec_... paste into RESEND_WEBHOOK_SECRET
